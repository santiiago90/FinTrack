name: FinTrack CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Versão LTS recomendada
          cache: 'npm'

      - name: Instalar dependências (reproduzível)
        run: npm ci

      - name: Executar Linter
        run: npm run lint

      - name: Compilar (Build)
        run: npm run build

      - name: Executar Testes
        run: npm run test
